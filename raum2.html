<title>Escape-Room Zuordnungen – Raum 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: Statusleiste, darunter die Comic-Szene „Schulflur“ mit klickbaren Spinden; Wertetabellen öffnen sich als Comic-Panels. Ein bewusst helles Comic-Design wie in Raum 1. */
[hidden]{display:none!important}
:root{
  --paper:#fffaea;
  --ink:#1d1630;
  --purple:#5b3a96;
  --purple-deep:#2f1f52;
  --sun:#ffd23f;
  --blue:#2f7fd6;
  --red:#e0483e;
  --orange:#f08a24;
  --grey:#6f6a7d;
  --ok:#1f9d55;
  --bad:#d23c3c;
  --display:"Bangers","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0;background:var(--purple-deep);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--paper)}
.topbar .school{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem;opacity:.9}
.topbar .room{font-family:var(--display);font-size:1.3rem;letter-spacing:.05em;color:var(--sun)}

.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.45em;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.25em .9em;font-weight:800;font-size:1.1rem;box-shadow:3px 3px 0 #000;font-variant-numeric:tabular-nums}
.pill.late{color:var(--bad)}
.inv{display:inline-flex;gap:6px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:.2em .5em;box-shadow:3px 3px 0 #000}
.inv .lab{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);margin-right:4px}
.inv .s{width:2.6em;height:2.1em;border-radius:6px;background:#c9c5d3;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.inv .s.got{background:var(--sun)}
.pill.btnlike{cursor:pointer;font-family:var(--body)}
.pill.btnlike:hover{background:var(--sun)}
.pill.btnlike:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.progress{display:inline-flex;gap:5px;align-items:center;margin-left:auto;color:var(--paper);font-weight:800;font-size:.85rem}
.progress i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:block}
.progress i.ok{background:var(--ok)} .progress i.on{background:var(--sun)}

.scene{position:relative;width:100%;max-width:100%;aspect-ratio:1672/941;border:4px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:6px 6px 0 #000;background:#333}
.scene img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.hot:hover,.hot:focus-visible{outline:3px dashed var(--sun);outline-offset:2px;background:rgba(255,210,63,.12)}
.hot.task:not(.done){animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 18px 6px rgba(255,210,63,.5)}}
.hot.done::after{content:"✓";position:absolute;top:6%;left:50%;transform:translateX(-50%);width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;border:2px solid var(--ink);font-size:clamp(10px,1.6vw,20px)}
/* Anzeigen im Bild – wie in Raum 1 */
.scene{container-type:inline-size}
.h-top,.h-prog,.h-inv{position:absolute;font-family:var(--body);font-weight:800;color:#111;z-index:2}
.h-top{left:74.6%;top:1.2%;width:24.6%;height:7.6%;display:flex;gap:.6cqw;justify-content:flex-end;font-size:1.9vw;font-size:2cqw}
.h-pill{height:100%;display:flex;align-items:center;gap:.5cqw;padding:0 .9cqw;background:#fafafa;border:.28cqw solid var(--ink);border-radius:1.3cqw;box-shadow:.25cqw .25cqw 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-pill .ico{font-size:1.15em}
.h-pill.late{color:var(--bad)}
.h-gear{height:100%;aspect-ratio:1;border-radius:50%;background:#fafafa;border:.28cqw solid var(--ink);box-shadow:.25cqw .25cqw 0 #000;font-size:1.2em;cursor:pointer;padding:0;display:grid;place-items:center}
.h-gear:hover,.map:hover{background:var(--sun)}
.h-gear:focus-visible,.map:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.h-prog{left:1.1%;top:85.3%;width:19.5%;height:12.6%;background:var(--paper);border:.28cqw solid var(--ink);border-radius:.9cqw;box-shadow:.25cqw .25cqw 0 #000;display:flex;flex-direction:column;justify-content:center;gap:.4cqw;padding:0 1.1cqw;font-size:1.35vw;font-size:1.45cqw;transform:rotate(-1deg)}
.h-dots{display:flex;justify-content:space-between}
.h-dots>span{display:flex;flex-direction:column;align-items:center;font-size:.9em;line-height:1.1}
.h-dots i{width:2.1cqw;height:2.1cqw;border-radius:50%;border:.22cqw solid var(--ink);background:#fff;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.8em}
.h-dots i.ok{background:var(--ok)} .h-dots i.on{background:var(--sun)}
.h-inv{left:33%;top:84.6%;width:28.5%;height:13.4%;background:#fdf2c4;border:.3cqw solid var(--ink);border-radius:1cqw;box-shadow:.25cqw .25cqw 0 #000;display:flex;align-items:center;padding:0 1cqw;font-size:1.5vw;font-size:1.6cqw}
.h-tab{position:absolute;top:-1.6cqw;left:1.5cqw;background:#fff;border:.25cqw solid var(--ink);border-radius:.5cqw;padding:.05cqw .8cqw;font-size:1.3cqw;transform:rotate(-2deg)}
.h-slots{display:flex;gap:.8cqw;width:100%;justify-content:space-between;margin-top:.6cqw}
.h-slots .s{flex:1;aspect-ratio:1.15;max-height:7.5cqw;border-radius:.7cqw;background:#9a96a6;border:.22cqw solid var(--ink);display:grid;place-items:center;font-size:1.8cqw;font-weight:800;color:var(--ink);padding:0}
.h-slots .s.got{background:var(--sun)}
.h-slots .map{background:#fff;cursor:pointer;font-size:2.6cqw}
.tag{position:absolute;pointer-events:none;font-family:var(--display);color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink);font-size:clamp(12px,2.6vw,34px);display:flex;justify-content:center}

.bar{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--body);font-weight:800;font-size:.95rem;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:.35em .9em;box-shadow:3px 3px 0 #000;cursor:pointer;display:inline-flex;gap:.4em;align-items:center}
.chip:hover{background:var(--sun)}
.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chip.done{background:#d9f5e4}
.chip .st{font-size:.8em;color:var(--grey)}
footer{color:var(--paper);text-align:right;font-size:.85rem;opacity:.9;padding-top:4px}

.overlay{position:fixed;inset:0;background:rgba(20,12,36,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:8px;box-shadow:8px 8px 0 #000;width:min(800px,100%);max-height:100%;overflow:auto;padding:20px 22px 22px;position:relative;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.04em;margin:0;line-height:1.05;text-wrap:balance;color:var(--purple)}
.panel p{margin:0}
.close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1}
.close:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-right:46px}
.steps{display:flex;gap:6px}
.steps i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:block}
.steps i.on{background:var(--sun)} .steps i.ok{background:var(--ok)}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.card{background:#fff;border:3px solid var(--ink);border-radius:6px;padding:14px 16px}
.typebadge{display:inline-block;font-family:var(--display);font-size:1.35rem;letter-spacing:.05em;color:#fff;border:3px solid var(--ink);border-radius:8px;padding:.05em .55em;box-shadow:2px 2px 0 #000}
.typebadge.p{background:var(--blue)} .typebadge.a{background:var(--orange)}
.ctx{font-weight:700;font-size:1.05rem}

.tablebox{overflow-x:auto;padding:4px 2px 6px}
table.wt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.15rem}
table.wt th,table.wt td{border:2px solid var(--ink);padding:.35em .5em;text-align:center;min-width:3.6em}
table.wt th{background:#efe7ff;text-align:left;font-size:.95rem;white-space:nowrap}
table.wt td.full{background:#fff2b8;font-weight:800}
table.wt tr.calc td,table.wt tr.calc th{background:#d9f5e4;font-size:1rem}
table.wt input{width:4.4em;font:inherit;font-weight:700;text-align:center;border:2px dashed var(--purple);border-radius:6px;padding:.2em .2em;background:#faf7ff;color:var(--ink)}
table.wt input:focus{outline:3px solid var(--sun);border-style:solid}
table.wt input.right{border:2px solid var(--ok);background:#d9f5e4}
table.wt input.wrongv{border:2px solid var(--bad);background:#ffe0dc}
.legend{font-size:.85rem;color:var(--grey);font-weight:700}
.legend b{background:#fff2b8;border:2px solid var(--ink);padding:0 .35em;border-radius:3px;color:var(--ink)}

.fb{border:3px solid var(--ink);border-radius:6px;padding:12px 14px;font-weight:600}
.fb.good{background:#d9f5e4} .fb.wrong{background:#ffe0dc} .fb.tip{background:#fff2b8}
.fb b.t{font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.04em;display:block}
.btn{font-family:var(--body);font-weight:800;font-size:1rem;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:.6em 1.2em;box-shadow:3px 3px 0 #000;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.btn.alt{background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.merk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.merk .card{display:flex;flex-direction:column;gap:6px;padding:12px}
.merk h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.04em}
.merk ol{margin:0;padding-left:1.3em}
.merk .p h4{color:var(--blue)} .merk .a h4{color:var(--orange)}
.merk .ex{font-size:.9rem;color:var(--grey);font-weight:700}

.keypad{display:flex;flex-direction:column;align-items:center;gap:12px}
.display{display:flex;gap:8px}
.display span{width:58px;height:70px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:8px;background:var(--purple-deep);color:var(--sun);font-family:var(--display);font-size:2.6rem}
.display small{display:block}
.keys10{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keys10 button{height:52px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;font-size:1.3rem;cursor:pointer;box-shadow:2px 2px 0 #000;font-family:var(--body)}
.keys10 button:active{transform:translate(2px,2px);box-shadow:none}
.keys10 button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.keys10 .del{background:#ffe0dc} .keys10 .go{background:var(--ok);color:#fff}
.lock{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel .lbl{font-size:.8rem;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
.wheel button{width:56px;height:40px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.wheel button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wheel output{width:64px;height:72px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:8px;background:var(--purple-deep);color:var(--sun);font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums}
.carry{background:#efe7ff}
.keytags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.keytag{border:3px solid var(--ink);border-radius:8px;padding:.3em .7em;background:#fff;font-weight:800}
.keytag.got{background:var(--sun)}
.big{font-family:var(--display);font-size:3rem;color:var(--purple);letter-spacing:.04em;line-height:1}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stats .card{flex:1 1 140px;text-align:center}
.stats .n{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--purple);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px}

@media (max-width:620px){
  .merk{grid-template-columns:1fr}
  .panel{padding:16px}
  .panel h2{font-size:1.6rem}
  .progress{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.hot.task:not(.done){animation:none;outline:3px dashed var(--sun)}}
</style>

const pick=a=>a[rand(a.length)];
const r2=n=>Math.round(n*100)/100;
const de=n=>String(r2(n)).replace(".",",");
const dec=n=>Math.abs(r2(n)-n)<1e-9;

/* ---------- Sachzusammenhänge ---------- */
const P_CTX=[
 {s:"Hefte kaufen: Alle Hefte kosten gleich viel.",x:"Anzahl Hefte",y:"Preis (€)",k:[1.2,1.5,2],kh:[0.75,1.25,0.85],xs:[1,2,3,4,5,6,8,10,12]},

 {s:"Babysitten: Es gibt einen festen Stundenlohn.",x:"Arbeitszeit (h)",y:"Verdienst (€)",k:[8,9,12],kh:[8.5,9.5,10.5],xs:[1,2,3,4,5,6,8,10]},
 {s:"Kuchen backen: Jeder Kuchen braucht gleich viel Mehl.",x:"Anzahl Kuchen",y:"Mehl (g)",k:[250,300,400],kh:[350,450,375],xs:[1,2,3,4,5,6,8]},
 {s:"Tanken: Jeder Liter kostet gleich viel.",x:"Benzin (l)",y:"Preis (€)",k:[2],kh:[1.8,1.7,1.9],xs:[5,10,15,20,25,30,40,50]}
];
const A_CTX=[
 {s:"Maler streichen eine Turnhalle. Alle arbeiten gleich schnell.",x:"Anzahl Maler",y:"Zeit (Tage)",c:[24,36,48,60],xmax:12},
 {s:"Ein Futtervorrat für Kaninchen. Alle fressen gleich viel.",x:"Anzahl Kaninchen",y:"Zeit (Tage)",c:[36,48,60,72],xmax:12},

 {s:"Gleich starke Pumpen füllen ein Schwimmbecken.",x:"Anzahl Pumpen",y:"Füllzeit (h)",c:[24,36,48,60],xmax:12}
];

function makeTask(type,hard,used){
  let X,Y,ctx,f;
  if(type==="p"){
    ctx=pick(P_CTX.filter(c=>!used.has(c.s))||P_CTX);if(!ctx)ctx=pick(P_CTX);
    const k=pick(hard?ctx.kh:ctx.k);
    X=shuffle(ctx.xs).slice(0,5).sort((a,b)=>a-b);Y=X.map(x=>r2(k*x));f=k;
  }else{
    ctx=pick(A_CTX.filter(c=>!used.has(c.s)));if(!ctx)ctx=pick(A_CTX);
    const c=pick(ctx.c);
    let cand=[];for(let x=ctx.xmin||1;x<=ctx.xmax;x++){if(x===c)continue;const y=c/x;if(hard?(dec(y)&&Math.abs(y*10-Math.round(y*10))<1e-9):Number.isInteger(y))cand.push(x)}
    if(hard){const nonInt=cand.filter(x=>!Number.isInteger(c/x));const ints=cand.filter(x=>Number.isInteger(c/x));X=shuffle(nonInt).slice(0,2).concat(shuffle(ints)).slice(0,5)}
    else X=shuffle(cand).slice(0,5);
    X.sort((a,b)=>a-b);Y=X.map(x=>r2(c/x));f=c;
  }
  used.add(ctx.s);
  const full=rand(5);
  const others=shuffle([0,1,2,3,4].filter(i=>i!==full));
  const hide=[null,null,null,null,null];
  others.forEach((i,n)=>hide[i]=n<2?"y":"x");
  return {type,ctx,X,Y,f,full,hide,fails:0};
}
function makePackage(kind){
  const used=new Set();
  if(kind==="p")return [0,1,2].map(i=>makeTask("p",i===2,used));
  if(kind==="a")return [0,1,2].map(i=>makeTask("a",false,used));
  return shuffle(["p","a",pick(["p","a"])]).map(t=>makeTask(t,true,used));
}

let S;

function readCarry(){
  try{const q=new URLSearchParams(location.search);
    if(q.has("rest")){const c={rest:+q.get("rest"),fehler:+q.get("fehler"),zeit:+q.get("zeit")};
      if([c.rest,c.fehler,c.zeit].every(Number.isFinite)&&c.fehler>=0&&c.zeit>=0)return c;}}catch(e){}
  try{const c=JSON.parse(localStorage.getItem("escape-zuordnungen-r1"));
    if(c&&Number.isFinite(c.rest)&&Date.now()-c.ts<6*3600*1000)return c;}catch(e){}
  return null;
}

const bar=$("#bar");
function renderBar(){
  const items=[["s1","🔵 Spind 1"],["s2","🔴 Spind 2"],["s3","🔵 Spind 3"],["tuer","🚪 Glastür"],["buecher","📚 Merkhilfe"]];

}
const keysGot=()=>ORDER.filter(k=>S.st[k].done).length;
function renderAll(){
  ORDER.forEach((k,i)=>{$("#h-"+k).classList.toggle("done",S.st[k].done);const s=$("#inv"+i);
    s.className="s"+(S.st[k].done?" got":"");s.textContent=S.st[k].done?"🔑"+S.st[k].digit:"";});
  $("#h-tuer").classList.toggle("done",S.escaped);
  $("#keycount").textContent=keysGot()+"/3";
  renderTimer();renderBar();
}
const fmt=sec=>{const a=Math.abs(sec);return (sec<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0")};
function renderTimer(){$("#time").textContent=S.timerOn?fmt(S.seconds):"--:--";$("#timer").classList.toggle("late",S.seconds<0)}
let tick=null;
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!S.started||S.escaped||!S.timerOn)return;S.seconds--;renderTimer();
  if(S.seconds===0&&overlay.hidden)showPanel(`<h2 id="ptitle">Die Zeit ist um!</h2><p>Die 30 Minuten sind abgelaufen. Ihr dürft trotzdem weiterspielen – die Uhr zählt jetzt in Rot weiter.</p><div class="row"><button class="btn" data-close>Weiterspielen</button></div>`);
},1000)}
$("#gear").addEventListener("click",()=>openThing("zahnrad"));
$("#map").addEventListener("click",()=>openThing("vitrine"));

let AC=null;
function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime;o.type=ok?"triangle":"sawtooth";o.frequency.setValueAtTime(ok?660:200,t);if(ok)o.frequency.setValueAtTime(880,t+.09);
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+(ok?.25:.3));o.start(t);o.stop(t+.3);}catch(e){}}

/* ---------- Panels ---------- */
let lastFocus=null;
function showPanel(html,focusSel){lastFocus=document.activeElement;panel.innerHTML=`<button class="close" data-close aria-label="Schließen">✕</button>`+html;overlay.hidden=false;
  panel.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closePanel));panel.scrollTop=0;
  const f=(focusSel&&panel.querySelector(focusSel))||panel.querySelector(".btn")||panel.querySelector(".close");f&&f.focus();}
function closePanel(){overlay.hidden=true;panel.innerHTML="";renderAll();lastFocus&&lastFocus.focus&&lastFocus.focus();}
overlay.addEventListener("click",e=>{if(e.target===overlay&&S.started)closePanel()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!overlay.hidden&&S.started)closePanel()});

function openThing(id){
  if(!S.started){intro();return}
  if(ST[id])return station(id);
  if(id==="tuer")return door();
  if(id==="buecher")return merk();
  if(id==="zettel")return showPanel(`<h2 id="ptitle">Ein Klebezettel</h2><div class="card"><p class="ctx">„Die Glastür merkt sich die Spinde von <b>links nach rechts</b>. 1 – 2 – 3. 😊“</p></div><div class="row"><button class="btn" data-close>Zurück in den Flur</button></div>`);
  if(id==="rucksack"||id==="globus")return tipp(id);
  if(id==="bild")return showPanel(`<h2 id="ptitle">Ein schönes Burgbild</h2><p>Ihr hebt das Bild an … dahinter ist nur die Wand. Hier ist nichts versteckt.</p><div class="row"><button class="btn" data-close>Zurück in den Flur</button></div>`);
  if(id==="vitrine")return plan();
  if(id==="zahnrad")return settings();
}

function intro(){
  showPanel(`<h2 id="ptitle">Raum 2: Der Schulflur</h2>
   <p>Geschafft, ihr seid aus dem Klassenzimmer raus! Aber die <b>Glastür zur Bibliothek</b> ist mit einem Zahlenschloss gesichert.</p>
   ${CARRY?`<div class="card carry"><p>Aus Raum 1 bringt ihr <b>${fmt(Math.max(0,CARRY.rest))} Minuten</b> Restzeit und <b>${CARRY.fehler} Fehlversuche</b> mit. Für Raum 2 kommen 30 Minuten dazu: Ihr habt jetzt <b>${fmt(START)} Minuten</b>.</p></div>`:`<p>Ihr habt <b>30 Minuten</b> Zeit.</p>`}
   <p>In den <b>drei Spinden</b> stecken die Ziffern für den Code. Jedes Spindschloss öffnet sich erst, wenn ihr ${TABLES} Wertetabellen richtig ergänzt habt.</p>
   <div class="card"><p>Über jeder Tabelle steht, ob die Zuordnung <b>proportional</b> oder <b>antiproportional</b> ist. Ein Wertepaar ist <b>vollständig</b> (gelb). Bei allen anderen fehlt entweder x oder y.</p></div>
   <p class="label">Tipp: Die Bücher rechts unten sind eine Merkhilfe.</p>
   <div class="row"><button class="btn" id="go">Los geht's!</button></div>`);
  panel.querySelector(".close").hidden=true;
  $("#go").addEventListener("click",()=>{S.started=true;startTimer();closePanel();});
}

const stepsHTML=st=>`<div class="steps" aria-label="Fortschritt">${st.tasks.map((t,i)=>`<i class="${i<st.i?"ok":i===st.i?"on":""}"></i>`).join("")}</div>`;
function cell(t,i,row){
  const v=row==="x"?t.X[i]:t.Y[i];
  if(i===t.full)return `<td class="full">${de(v)}</td>`;
  if(t.hide[i]===row)return `<td><input id="in-${row}${i}" data-row="${row}" data-i="${i}" inputmode="decimal" autocomplete="off" aria-label="${row==="x"?t.ctx.x:t.ctx.y}, Spalte ${i+1}"></td>`;
  return `<td>${de(v)}</td>`;
}
function station(id){
  const st=S.st[id],info=ST[id];
  if(st.done){showPanel(`<h2 id="ptitle">${info.title}</h2><div class="fb good"><b class="t">Schon offen!</b>In diesem Spind habt ihr den Schlüssel mit der Ziffer <b>${st.digit}</b> gefunden.</div><div class="row"><button class="btn" data-close>Zurück in den Flur</button></div>`);return}
  const t=st.tasks[st.i];
  showPanel(`<div class="meta"><span class="label">${info.name} · Tabelle ${st.i+1} von ${TABLES}</span>${stepsHTML(st)}</div>
   <h2 id="ptitle">${info.title}</h2>${st.i===0?`<p>${info.intro}</p>`:""}
   <div class="row"><span class="typebadge ${t.type}">${NAMES[t.type]}</span><span class="ctx">${t.ctx.s}</span></div>
   <div class="card tablebox"><table class="wt" id="wt">
     <tr><th scope="row">${t.ctx.x}</th>${[0,1,2,3,4].map(i=>cell(t,i,"x")).join("")}</tr>
     <tr><th scope="row">${t.ctx.y}</th>${[0,1,2,3,4].map(i=>cell(t,i,"y")).join("")}</tr>
   </table></div>
   <p class="legend"><b>gelb</b> = vollständiges Wertepaar · Kommazahlen mit Komma eingeben, z. B. 2,5</p>
   <div class="row"><button class="btn" id="check">Prüfen</button></div>
   <div id="fb" aria-live="polite"></div>`,"input");
  const inputs=[...panel.querySelectorAll("table.wt input")];
  inputs.forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter")check(id)}));
  $("#check").addEventListener("click",()=>check(id));
}
function parseNum(s){s=String(s).trim().replace(/\s/g,"").replace(",",".");if(!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)}
function check(id){
  const st=S.st[id],t=st.tasks[st.i],fb=$("#fb");
  const inputs=[...panel.querySelectorAll("table.wt input")];
  let wrong=0,empty=0;
  inputs.forEach(inp=>{
    if(inp.readOnly)return;
    const i=+inp.dataset.i,row=inp.dataset.row,soll=row==="x"?t.X[i]:t.Y[i],v=parseNum(inp.value);
    inp.classList.remove("right","wrongv");
    if(inp.value.trim()===""){empty++;return}
    if(Math.abs(v-soll)<1e-6){inp.classList.add("right");inp.readOnly=true}else{inp.classList.add("wrongv");wrong++}
  });
  if(empty&&!wrong){fb.innerHTML=`<div class="fb tip"><b class="t">Fast …</b>Es sind noch ${empty} ${empty===1?"Feld":"Felder"} leer. Füllt alle aus und prüft dann noch einmal.</div>`;const e=inputs.find(i=>!i.readOnly&&!i.value.trim());e&&e.focus();return}
  if(wrong||empty){
    beep(false);S.mistakes++;t.fails++;
    let h=`<div class="fb wrong"><b class="t">Das Schloss klemmt …</b>${wrong} ${wrong===1?"Wert ist":"Werte sind"} noch falsch (rot markiert).${empty?` ${empty} ${empty===1?"Feld ist":"Felder sind"} noch leer.`:""} Die grünen Werte stimmen schon.</div>`;
    if(t.fails===1)h+=`<div class="fb tip" style="margin-top:10px">${t.type==="p"?"Tipp: Rechnet am gelben Wertepaar aus, mit welcher Zahl man x multiplizieren muss, um y zu erhalten (y : x).":"Tipp: Rechnet am gelben Wertepaar das Produkt x · y aus. Es ist bei allen Paaren gleich."}</div>`;
    if(t.fails>=2)h+=`<div class="fb tip" style="margin-top:10px">${t.type==="p"?`Großer Tipp: y : x = ${de(t.f)}. Also gilt y = ${de(t.f)} · x und x = y : ${de(t.f)}.`:`Großer Tipp: x · y = ${de(t.f)}. Also gilt y = ${de(t.f)} : x und x = ${de(t.f)} : y.`}</div>`;
    fb.innerHTML=h;const e=inputs.find(i=>!i.readOnly);e&&e.focus();return;
  }
  beep(true);$("#check").disabled=true;$("#check").hidden=true;
  const lab=t.type==="p"?"y : x":"x · y";
  $("#wt").insertAdjacentHTML("beforeend",`<tr class="calc"><th scope="row">${lab}</th>${t.X.map((x,i)=>`<td>${de(t.type==="p"?t.Y[i]/x:x*t.Y[i])}</td>`).join("")}</tr>`);
  const last=st.i===TABLES-1;
  fb.innerHTML=`<div class="fb good"><b class="t">Alles richtig!</b>${t.type==="p"?`Der Quotient y : x ist überall ${de(t.f)}.`:`Das Produkt x · y ist überall ${de(t.f)}.`}</div><div class="row" style="margin-top:10px"><button class="btn" id="next">${last?"Spind öffnen":"Nächste Tabelle"}</button></div>`;
  $("#next").focus();
  $("#next").addEventListener("click",()=>{st.i++;if(st.i>=TABLES){st.done=true;foundKey(id)}else station(id)});
}
function foundKey(id){
  renderAll();const n=keysGot();
  showPanel(`<h2 id="ptitle">Quietsch – der Spind ist offen!</h2>
   <div class="row"><span class="big">🔑 ${S.st[id].digit}</span><p>In <b>${ST[id].name}</b> liegt ein Schlüssel mit der Ziffer <b>${S.st[id].digit}</b>. Er liegt jetzt in eurem Inventar.</p></div>
   <p>${n<3?`Ihr habt ${n} von 3 Ziffern. Weiter geht's!`:"Alle drei Ziffern sind gefunden. Ab zur Glastür!"}</p>
   <div class="row"><button class="btn" id="kgo">${n<3?"Zurück in den Flur":"Zur Glastür"}</button></div>`);
  $("#kgo").addEventListener("click",()=>{if(n===3)door();else closePanel()});
}

function door(){
  if(S.escaped)return win();
  const n=keysGot();
  const tags=ORDER.map(k=>`<span class="keytag ${S.st[k].done?"got":""}">${ST[k].name}: ${S.st[k].done?S.st[k].digit:"?"}</span>`).join("");
  if(n<3){showPanel(`<h2 id="ptitle">Die Glastür ist verschlossen</h2><p>Hinter der Glastür liegt die Bibliothek. Am Griff hängt ein Zahlenschloss mit drei Rädern. Auf dem Schloss steht: <b>Spind 1 – Spind 2 – Spind 3</b>.</p><div class="keytags">${tags}</div><p>Euch fehlen noch ${3-n} von 3 Schlüsseln. Öffnet die leuchtenden Spinde.</p><div class="row"><button class="btn" data-close>Zurück in den Flur</button></div>`);return}
  showPanel(`<h2 id="ptitle">Das Zahlenschloss an der Glastür</h2><p>Stellt die Ziffern eurer Schlüssel in der richtigen Reihenfolge ein: <b>Spind 1 – Spind 2 – Spind 3</b>.</p>
   <div class="keytags">${tags}</div>
   <div class="lock">${ORDER.map((k,i)=>`<div class="wheel"><span class="lbl">${ST[k].name}</span><button data-w="${i}" data-d="1" aria-label="${ST[k].name} höher">▲</button><output id="w${i}">${S.lock[i]}</output><button data-w="${i}" data-d="-1" aria-label="${ST[k].name} niedriger">▼</button></div>`).join("")}</div>
   <div class="row"><button class="btn" id="open">Schloss öffnen</button></div><div id="fb" aria-live="polite"></div>`,".wheel button");
  panel.querySelectorAll(".wheel button").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.w;S.lock[i]=(S.lock[i]+ +b.dataset.d+10)%10;$("#w"+i).textContent=S.lock[i];}));
  $("#open").addEventListener("click",()=>{
    if(ORDER.every((k,i)=>S.lock[i]===S.st[k].digit)){S.escaped=true;beep(true);renderAll();win();}
    else{beep(false);$("#fb").innerHTML=`<div class="fb wrong"><b class="t">Rüttel, rüttel … zu!</b>Die Kombination stimmt nicht. Vergleicht die Ziffern auf den Schlüsseln und achtet auf die Reihenfolge.</div>`;}
  });
}
function win(){
  const used=START-S.seconds;
  const carry={rest:S.seconds,fehler:(CARRY?CARRY.fehler:0)+S.mistakes,zeit:(CARRY?CARRY.zeit:0)+used,ts:Date.now()};
  try{localStorage.setItem("escape-zuordnungen-r2",JSON.stringify(carry))}catch(e){}
  showPanel(`<h2 id="ptitle">Raum 2 geschafft!</h2><p>Das Schloss springt auf, die Glastür gleitet zur Seite. Ihr könnt Wertetabellen von proportionalen und antiproportionalen Zuordnungen sicher ergänzen!</p>
   <p class="label">Raum 2</p>
   <div class="stats"><div class="card"><div class="n">${fmt(used).replace("+","")}</div><span class="label">benötigte Zeit</span></div><div class="card"><div class="n">${S.mistakes}</div><span class="label">Fehlversuche</span></div><div class="card"><div class="n">${3*TABLES}</div><span class="label">ergänzte Tabellen</span></div></div>
   ${CARRY?`<p class="label">Gesamt (Raum 1 und 2)</p><div class="stats"><div class="card carry"><div class="n">${fmt(carry.zeit)}</div><span class="label">Gesamtzeit</span></div><div class="card carry"><div class="n">${carry.fehler}</div><span class="label">Fehlversuche gesamt</span></div><div class="card carry"><div class="n">${fmt(Math.max(0,S.seconds))}</div><span class="label">Restzeit</span></div></div>`:""}
   <p>Zeigt dieses Bild eurer Lehrerin. Raum 3, die Bibliothek, folgt bald!</p>
   <div class="row"><button class="btn" id="again">Nochmal mit neuen Tabellen</button><button class="btn alt" data-close>Im Flur bleiben</button></div>`);
  $("#again").addEventListener("click",restart);
}

function merk(){
  showPanel(`<h2 id="ptitle">Merkhilfe: Tabellen ergänzen</h2>
   <div class="merk">
    <div class="card p"><h4>proportional</h4><ol><li>Am vollständigen Paar <b>k = y : x</b> berechnen.</li><li>Fehlt y: <b>y = k · x</b></li><li>Fehlt x: <b>x = y : k</b></li></ol><p class="ex">Beispiel: x = 4, y = 10 → k = 2,5.<br>x = 6 → y = 2,5 · 6 = 15<br>y = 20 → x = 20 : 2,5 = 8</p></div>
    <div class="card a"><h4>antiproportional</h4><ol><li>Am vollständigen Paar das Produkt <b>x · y</b> berechnen.</li><li>Fehlt y: <b>y = Produkt : x</b></li><li>Fehlt x: <b>x = Produkt : y</b></li></ol><p class="ex">Beispiel: x = 4, y = 6 → x · y = 24.<br>x = 8 → y = 24 : 8 = 3<br>y = 12 → x = 24 : 12 = 2</p></div>
   </div>
   <p class="label">Probe: Bei proportional ist y : x überall gleich, bei antiproportional ist x · y überall gleich.</p>
   <div class="row"><button class="btn" data-close>Zurück in den Flur</button></div>`);
}
const TIPS=["Proportional: doppelt so viel x → doppelt so viel y.","Antiproportional: doppelt so viel x → halb so viel y.","Rechnet zuerst den Faktor oder das Produkt am gelben Paar aus. Dann geht der Rest ganz schnell.","Macht am Ende die Probe: Ist y : x (oder x · y) überall gleich?","Ihr dürft auch mit dem Dreisatz über die 1 rechnen.","Bei antiproportionalen Zuordnungen gehört zum größeren x immer das kleinere y."];
let tipI=rand(TIPS.length);
function tipp(id){tipI=(tipI+1)%TIPS.length;showPanel(`<h2 id="ptitle">${id==="rucksack"?"Im Rucksack …":"Der Globus dreht sich …"}</h2><p>${id==="rucksack"?"… liegt zwischen Pausenbrot und Federtasche ein Spickzettel:":"… und bleibt bei einem kleinen Zettel stehen:"}</p><div class="card"><p class="ctx">💡 ${TIPS[tipI]}</p></div><div class="row"><button class="btn" data-close>Danke!</button></div>`)}
function plan(){
  showPanel(`<h2 id="ptitle">Die Pokal-Vitrine</h2><p>Zwischen den Pokalen hängt eure Fortschrittstafel:</p>
   <div class="keytags">${ORDER.map(k=>`<span class="keytag ${S.st[k].done?"got":""}">${ST[k].name}: ${S.st[k].done?"✓ Ziffer "+S.st[k].digit:S.st[k].i+" von "+TABLES}</span>`).join("")}<span class="keytag ${S.escaped?"got":""}">Glastür: ${S.escaped?"✓ offen":"verschlossen"}</span></div>
   <p>Bisherige Fehlversuche: <b>${S.mistakes}</b></p><div class="row"><button class="btn" data-close>Zurück in den Flur</button></div>`);
}
function settings(){
  showPanel(`<h2 id="ptitle">Einstellungen</h2>
   <label class="switch"><input type="checkbox" id="s-sound" ${S.sound?"checked":""}> Töne bei richtig und falsch</label>
   <label class="switch"><input type="checkbox" id="s-timer" ${S.timerOn?"checked":""}> Stoppuhr anzeigen (30 Minuten)</label>
   <div class="row"><button class="btn" data-close>Fertig</button><button class="btn alt" id="s-new">Neues Spiel mit neuen Tabellen</button></div><div id="fb"></div>`);
  $("#s-sound").addEventListener("change",e=>S.sound=e.target.checked);
  $("#s-timer").addEventListener("change",e=>{S.timerOn=e.target.checked;renderTimer()});
  $("#s-new").addEventListener("click",()=>{$("#fb").innerHTML=`<div class="fb wrong">Wirklich neu starten? Alle Ziffern gehen verloren.<div class="row" style="margin-top:8px"><button class="btn" id="s-yes">Ja, neu starten</button></div></div>`;$("#s-yes").addEventListener("click",restart);});
}
function restart(){const snd=S.sound,tm=S.timerOn;S=newState();S.sound=snd;S.timerOn=tm;S.started=true;startTimer();closePanel();}

S=newState();renderAll();intro();
})();
</script>

<title>Escape-Room Zuordnungen – Raum 1</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Escape-Room">
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: Comic-Szene als Bühne, darüber klickbare Gegenstände; Rätsel öffnen sich als Comic-Panels. Bewusst ein einziges, helles Comic-Design. */
:root{
  --paper:#fffaea;
  --ink:#1d1630;
  --purple:#5b3a96;
  --purple-deep:#2f1f52;
  --sun:#ffd23f;
  --blue:#2f7fd6;
  --orange:#f08a24;
  --grey:#6f6a7d;
  --ok:#1f9d55;
  --bad:#d23c3c;
  --display:"Bangers","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{margin:0;background:var(--purple-deep);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--paper)}
.topbar .school{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem;opacity:.9}
.topbar .room{font-family:var(--display);font-size:1.3rem;letter-spacing:.05em;color:var(--sun)}

/* Szene */
.scene{position:relative;width:100%;max-width:100%;aspect-ratio:1672/941;border:4px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:6px 6px 0 #000;background:#333}
.scene img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.hot:focus-visible{outline:3px dashed var(--sun);outline-offset:2px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 18px 6px rgba(255,210,63,.55)}}
.hot.done::after{content:"✓";position:absolute;top:-4px;right:-4px;width:1.6em;height:1.6em;display:grid;place-items:center;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;border:2px solid var(--ink);font-size:clamp(10px,1.4vw,18px)}
.badge-cover{position:absolute;background:#fafafa;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:800;color:#111;font-variant-numeric:tabular-nums;font-size:clamp(9px,2.35vw,30px);pointer-events:none;line-height:1}
.badge-cover.late{color:var(--bad)}
/* Anzeigen im Bild – wie in Raum 1 */
.scene{container-type:inline-size}
.h-top,.h-prog,.h-inv{position:absolute;font-family:var(--body);font-weight:800;color:#111;z-index:2}
.h-top{left:74.6%;top:1.2%;width:24.6%;height:7.6%;display:flex;gap:.6cqw;justify-content:flex-end;font-size:1.9vw;font-size:2cqw}
.h-pill{height:100%;display:flex;align-items:center;gap:.5cqw;padding:0 .9cqw;background:#fafafa;border:.28cqw solid var(--ink);border-radius:1.3cqw;box-shadow:.25cqw .25cqw 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-pill .ico{font-size:1.15em}
.h-pill.late{color:var(--bad)}
.h-gear{height:100%;aspect-ratio:1;border-radius:50%;background:#fafafa;border:.28cqw solid var(--ink);box-shadow:.25cqw .25cqw 0 #000;font-size:1.2em;cursor:pointer;padding:0;display:grid;place-items:center}
.h-gear:hover,.map:hover{background:var(--sun)}
.h-gear:focus-visible,.map:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.h-prog{left:1.1%;top:85.6%;width:21.8%;height:14%;background:var(--paper);border:.28cqw solid var(--ink);border-radius:.9cqw;box-shadow:.25cqw .25cqw 0 #000;display:flex;flex-direction:column;justify-content:center;gap:.4cqw;padding:0 1.1cqw;font-size:1.35vw;font-size:1.45cqw;transform:rotate(-1deg)}
.h-dots{display:flex;justify-content:space-between}
.h-dots>span{display:flex;flex-direction:column;align-items:center;font-size:.9em;line-height:1.1}
.h-dots i{width:2.1cqw;height:2.1cqw;border-radius:50%;border:.22cqw solid var(--ink);background:#fff;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.8em}
.h-dots i.ok{background:var(--ok)} .h-dots i.on{background:var(--sun)}
.h-inv{left:36.2%;top:85.2%;width:28.4%;height:14.3%;background:#fdf2c4;border:.3cqw solid var(--ink);border-radius:1cqw;box-shadow:.25cqw .25cqw 0 #000;display:flex;align-items:center;padding:0 1cqw;font-size:1.5vw;font-size:1.6cqw}
.h-tab{position:absolute;top:-1.6cqw;left:1.5cqw;background:#fff;border:.25cqw solid var(--ink);border-radius:.5cqw;padding:.05cqw .8cqw;font-size:1.3cqw;transform:rotate(-2deg)}
.h-slots{display:flex;gap:.8cqw;width:100%;justify-content:space-between;margin-top:.6cqw}
.h-slots .s{flex:1;aspect-ratio:1.15;max-height:7.5cqw;border-radius:.7cqw;background:#9a96a6;border:.22cqw solid var(--ink);display:grid;place-items:center;font-size:1.8cqw;font-weight:800;color:var(--ink);padding:0}
.h-slots .s.got{background:var(--sun)}
.h-slots .map{background:#fff;cursor:pointer;font-size:2.6cqw}
.slot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,2.3vw,28px);pointer-events:none}
.slot .k{display:flex;flex-direction:column;align-items:center;line-height:1}
.slot .k b{font-family:var(--display);font-size:.8em;color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:4px;padding:0 .2em;margin-top:-.15em}
.dot2{position:absolute;border-radius:50%;pointer-events:none}

/* Stationsleiste (für kleine Bildschirme und Tastatur) */
.bar{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--body);font-weight:800;font-size:.95rem;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:.35em .9em;box-shadow:3px 3px 0 #000;cursor:pointer;display:inline-flex;gap:.4em;align-items:center}
.chip:hover{background:var(--sun)}
.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chip.done{background:#d9f5e4}
.chip .st{font-size:.8em;color:var(--grey)}

footer{color:var(--paper);text-align:right;font-size:.85rem;opacity:.9;padding-top:4px}

/* Panels */
.overlay{position:fixed;inset:0;background:rgba(20,12,36,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:8px;box-shadow:8px 8px 0 #000;width:min(760px,100%);max-height:100%;overflow:auto;padding:20px 22px 22px;position:relative;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.04em;margin:0;line-height:1.05;text-wrap:balance;color:var(--purple)}
.panel h3{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.04em;margin:0;color:var(--purple)}
.panel p{margin:0}
.close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1}
.close:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-right:46px}
.steps{display:flex;gap:6px}
.steps i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:block}
.steps i.on{background:var(--sun)}
.steps i.ok{background:var(--ok)}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.card{background:#fff;border:3px solid var(--ink);border-radius:6px;padding:14px 16px}
.card .q{font-size:1.1rem;font-weight:700}
.card .q em{font-style:normal;background:#fff2b8;padding:0 .2em;border-radius:3px}
.ask{font-weight:800}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice{font-family:var(--body);font-weight:800;font-size:1rem;border:3px solid var(--ink);border-radius:8px;padding:.8em .4em;cursor:pointer;color:#fff;box-shadow:3px 3px 0 #000;transition:transform .08s}
.choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.choice:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.choice[data-v="p"]{background:var(--blue)}
.choice[data-v="a"]{background:var(--orange)}
.choice[data-v="w"]{background:var(--grey)}
.choice:disabled{opacity:.45;cursor:default}
.fb{border:3px solid var(--ink);border-radius:6px;padding:12px 14px;font-weight:600}
.fb.good{background:#d9f5e4}
.fb.wrong{background:#ffe0dc}
.fb b.t{font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.04em;display:block}
.btn{font-family:var(--body);font-weight:800;font-size:1rem;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:.6em 1.2em;box-shadow:3px 3px 0 #000;cursor:pointer;align-self:flex-start}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.btn.alt{background:#fff}
a.btn{text-decoration:none;display:inline-block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

table.wt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.1rem;margin:4px 0}
table.wt th,table.wt td{border:2px solid var(--ink);padding:.35em .8em;text-align:center;min-width:3.2em}
table.wt th{background:#efe7ff}
table.wt tr.calc td,table.wt tr.calc th{background:#fff7d1;font-size:.95rem}
.tablebox{overflow-x:auto}
svg.graph{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}

.merk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.merk .card{display:flex;flex-direction:column;gap:6px;padding:12px}
.merk h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem;letter-spacing:.04em}
.merk ul{margin:0;padding-left:1.1em;font-size:.95rem}
.merk .p h4{color:var(--blue)} .merk .a h4{color:var(--orange)} .merk .w h4{color:var(--grey)}

.lock{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel .lbl{font-size:.8rem;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
.wheel button{width:56px;height:40px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.wheel button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wheel output{width:64px;height:72px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:8px;background:var(--purple-deep);color:var(--sun);font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:10px;flex-wrap:wrap}
.keytag{border:3px solid var(--ink);border-radius:8px;padding:.3em .7em;background:#fff;font-weight:800}
.keytag.got{background:var(--sun)}
.big{font-family:var(--display);font-size:3rem;color:var(--purple);letter-spacing:.04em;line-height:1}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stats .card{flex:1 1 140px;text-align:center}
.stats .n{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--purple);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px}

@media (max-width:620px){
  .choices{grid-template-columns:1fr}
  .merk{grid-template-columns:1fr}
  .panel{padding:16px}
  .panel h2{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>

<script>
(function(){

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[rand(a.length)];
const de=n=>{const r=Math.round(n*100)/100;return String(r).replace(".",",")};
const NAMES={p:"proportional",a:"antiproportional",w:"weder noch"};

/* ---------- Spielzustand ---------- */

  const digits=[1+rand(9),rand(10),rand(10)];
  return {started:false,seconds:30*60,timerOn:true,sound:true,mistakes:0,
    st:{
      laptop:{done:false,i:0,tasks:makeTextTasks(),digit:digits[0]},
      spind:{done:false,i:0,tasks:makeTableTasks(),digit:digits[1]},

/* ---------- Aufgaben: Text ---------- */
const TEXT={
 p:[
  ["Ein Kilogramm Äpfel kostet 2,40 €.","Masse der Äpfel (kg)","Preis (€)","Doppelt so viele Äpfel kosten doppelt so viel. Der Quotient Preis : Masse ist immer 2,40."],
  ["Ein Heft kostet 1,20 €.","Anzahl der Hefte","Gesamtpreis (€)","3 Hefte kosten das Dreifache von einem Heft. Kein Grundpreis, also proportional."],
  ["Ein Auto fährt immer mit 80 km/h.","Fahrzeit (h)","zurückgelegte Strecke (km)","In doppelter Zeit schafft das Auto die doppelte Strecke."],
  ["Ein Rezept für 4 Personen braucht 300 g Mehl.","Anzahl der Personen","Menge Mehl (g)","Für 8 Personen braucht man doppelt so viel Mehl, für 2 Personen die Hälfte."],
  ["Eine Druckerpatrone reicht für 250 Seiten.","Anzahl der Patronen","Anzahl der Seiten","Doppelt so viele Patronen reichen für doppelt so viele Seiten."],
  ["Lena verdient beim Babysitten 9 € pro Stunde.","Arbeitszeit (h)","Verdienst (€)","Pro Stunde kommen immer 9 € dazu, ohne Grundbetrag. Verdienst : Zeit ist immer 9."]
 ],
 a:[
  ["6 Maler streichen eine Turnhalle in 4 Tagen. Alle arbeiten gleich schnell.","Anzahl der Maler","benötigte Tage","Doppelt so viele Maler brauchen nur die halbe Zeit. Das Produkt Maler · Tage bleibt 24."],
  ["Ein Futtervorrat reicht für 12 Kaninchen 20 Tage.","Anzahl der Kaninchen","Anzahl der Tage","Mehr Kaninchen fressen den Vorrat schneller auf: doppelt so viele Tiere, halb so viele Tage."],
  ["Eine Strecke von 120 km soll gefahren werden.","Geschwindigkeit (km/h)","Fahrzeit (h)","Doppelte Geschwindigkeit, halbe Fahrzeit. Geschwindigkeit · Zeit = 120 bleibt gleich."],
  ["Ein Rechteck soll immer den Flächeninhalt 24 cm² haben.","Länge (cm)","Breite (cm)","Länge · Breite = 24. Wird die Länge doppelt so groß, muss die Breite halb so groß werden."],
  ["Ein Gewinn von 600 € wird gerecht aufgeteilt.","Anzahl der Personen","Anteil pro Person (€)","Doppelt so viele Personen bekommen jeweils nur die Hälfte. Personen · Anteil = 600."],
  ["Ein Becken wird mit gleich starken Pumpen gefüllt. Mit 3 Pumpen dauert es 8 Stunden.","Anzahl der Pumpen","Füllzeit (h)","Mehr Pumpen schaffen es schneller: doppelt so viele Pumpen, halbe Zeit."]
 ],

  ["Ein Kind wird älter.","Alter (Jahre)","Körpergröße (cm)","Ein 10-jähriges Kind ist nicht doppelt so groß wie ein 5-jähriges. Je mehr, desto mehr reicht nicht!"],
  ["Eine Kerze ist 20 cm lang und wird pro Stunde 2 cm kürzer.","Brenndauer (h)","Länge der Kerze (cm)","Die Kerze wird kürzer, aber nicht auf die Hälfte bei doppelter Zeit. Länge · Zeit ist nicht konstant. Also weder noch."],
  ["Ein Handytarif kostet 9,99 € im Monat plus 0,09 € pro Minute.","telefonierte Minuten","Monatsrechnung (€)","Wegen der festen 9,99 € ist die Rechnung bei doppelt so vielen Minuten nicht doppelt so hoch."],
  ["Ein Schwimmbad kostet 4 € Eintritt pro Besuch, die Jahreskarte einmalig 5 € extra.","Anzahl der Besuche (mit Jahreskarte)","Gesamtkosten (€)","Die einmaligen 5 € sorgen dafür, dass sich die Kosten nicht im gleichen Verhältnis ändern."],

 ]

function mix(){return shuffle(pick([["p","p","a","a","w"],["p","a","a","w","w"],["p","p","a","w","w"]]))}
function makeTextTasks(){
  const pools={p:shuffle(TEXT.p),a:shuffle(TEXT.a),w:shuffle(TEXT.w)};
  return mix().map(t=>{const [s,x,y,e]=pools[t].pop();return {type:t,kind:"text",s,x,y,e}});
}

/* ---------- Aufgaben: Wertetabelle ---------- */
function xs(n,max,filter){let c=[];for(let i=1;i<=max;i++)if(!filter||filter(i))c.push(i);return shuffle(c).slice(0,n).sort((a,b)=>a-b)}
function makeTable(t){
  let X,Y,e,calc;
  if(t==="p"){
    const k=pick([1.5,2,2.5,3,4,5,6,8,12]);X=xs(4,10);Y=X.map(x=>x*k);
    calc={lab:"y : x",vals:X.map((x,i)=>de(Y[i]/x))};
    e=`Alle Quotienten y : x sind gleich (${de(k)}). Das ist der Proportionalitätsfaktor.`;
  }else if(t==="a"){
    const c=pick([12,24,36,48,60,72,120]);X=xs(4,c,i=>c%i===0&&i<=24);Y=X.map(x=>c/x);
    calc={lab:"x · y",vals:X.map((x,i)=>de(x*Y[i]))};
    e=`Alle Produkte x · y sind gleich (${c}).`;
  }else{
    const v=rand(3);X=xs(4,8);
    if(v===0){const m=pick([2,3,4,5]),b=pick([1,2,3,4,6]);Y=X.map(x=>m*x+b);e=`Die y-Werte wachsen gleichmäßig, aber die Quotienten y : x sind verschieden. Hier steckt ein fester Startwert (+${b}) drin.`;calc={lab:"y : x",vals:X.map((x,i)=>de(Y[i]/x))};}
    else if(v===1){const m=pick([2,3,4]),b=pick([30,40,50]);Y=X.map(x=>b-m*x);e="Die y-Werte werden kleiner, aber die Produkte x · y sind verschieden. Kleiner werden allein reicht nicht für antiproportional.";calc={lab:"x · y",vals:X.map((x,i)=>de(Y[i]*x))};}
    else {Y=X.map(x=>x*x);e="Die y-Werte wachsen, aber nicht im gleichen Verhältnis: Die Quotienten y : x sind verschieden.";calc={lab:"y : x",vals:X.map((x,i)=>de(Y[i]/x))};}
  }
  return {type:t,kind:"table",X,Y,e,calc};
}
function makeTableTasks(){return mix().map(makeTable)}

/* ---------- Aufgaben: Graph ---------- */
function makeGraph(t){
  let f,pts,e,v=rand(2);
  if(t==="p"){const k=pick([0.5,1,1.5,2,3]);f=x=>k*x;{const c=[];for(let x=1;x<=10;x++){const y=k*x;if(y<=10&&Number.isInteger(y))c.push([x,y])}pts=c.length>3?[c[0],c[Math.floor(c.length/2)],c[c.length-1]]:c;}
    e="Der Graph ist eine Gerade durch den Ursprung (0|0). Das ist das Kennzeichen proportionaler Zuordnungen.";}
  else if(t==="a"){const c=pick([6,8,12]);f=x=>c/x;pts=[1,2,3,4,6,8].filter(x=>c%x===0&&c/x<=10&&x<=10).map(x=>[x,c/x]);
    e=`Der Graph ist eine Hyperbel (gekrümmt, nähert sich den Achsen). Prüfe die Punkte: x · y ist immer ${c}.`;}
  else{
    if(v===0){const m=pick([0.5,1]),b=pick([2,3,4]);f=x=>m*x+b;pts=[[0,b],[4,4*m+b]];e="Eine Gerade, aber sie geht nicht durch den Ursprung. Deshalb ist die Zuordnung nicht proportional.";}
    else {const r=rand(2);if(r===0){f=x=>10-x;pts=[[2,8],[5,5],[8,2]];e="Der Graph fällt, ist aber eine Gerade und keine Hyperbel. Prüfe: 2 · 8 = 16, aber 5 · 5 = 25. Also weder noch.";}
      else{f=x=>0.1*x*x;pts=[[0,0],[5,2.5],[10,10]];e="Der Graph beginnt im Ursprung, ist aber gekrümmt und keine Gerade. Also nicht proportional.";}}
  }
  return {type:t,kind:"graph",f,pts,e,hyper:t==="a"};
}
function makeGraphTasks(){return mix().map(makeGraph)}
function graphSVG(g){
  const L=40,B=300,Wd=300,Hd=270,sx=Wd/10,sy=Hd/10;
  const X=x=>L+x*sx, Y=y=>B-y*sy;
  let s=`<svg class="graph" viewBox="0 0 370 340" role="img" aria-label="Koordinatensystem mit einem Graphen">`;
  for(let i=0;i<=10;i++){s+=`<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(10)}" stroke="#d8d2e6" stroke-width="1"/><line x1="${X(0)}" y1="${Y(i)}" x2="${X(10)}" y2="${Y(i)}" stroke="#d8d2e6" stroke-width="1"/>`;}
  s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(10.6)}" y2="${Y(0)}" stroke="#1d1630" stroke-width="2.5"/><polygon points="${X(10.9)},${Y(0)} ${X(10.5)},${Y(0)-5} ${X(10.5)},${Y(0)+5}" fill="#1d1630"/>`;
  s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(10.6)}" stroke="#1d1630" stroke-width="2.5"/><polygon points="${X(0)},${Y(10.9)} ${X(0)-5},${Y(10.5)} ${X(0)+5},${Y(10.5)}" fill="#1d1630"/>`;
  for(let i=2;i<=10;i+=2){s+=`<text x="${X(i)}" y="${Y(0)+20}" text-anchor="middle" font-size="14" fill="#1d1630" font-family="Nunito,sans-serif">${i}</text><text x="${X(0)-10}" y="${Y(i)+5}" text-anchor="end" font-size="14" fill="#1d1630" font-family="Nunito,sans-serif">${i}</text>`;}
  s+=`<text x="${X(10.6)}" y="${Y(0)+22}" font-size="15" font-weight="700" fill="#1d1630" font-family="Nunito,sans-serif">x</text><text x="${X(0)+10}" y="${Y(10.6)+4}" font-size="15" font-weight="700" fill="#1d1630" font-family="Nunito,sans-serif">y</text><text x="${X(0)-12}" y="${Y(0)+18}" font-size="14" fill="#1d1630" text-anchor="end" font-family="Nunito,sans-serif">0</text>`;
  let d="",first=true;const start=g.hyper?0.55:0;
  for(let x=start;x<=10.001;x+=0.05){const y=g.f(x);if(y>10.3||y<-0.01){first=true;continue}d+=(first?"M":"L")+X(x).toFixed(1)+","+Y(y).toFixed(1)+" ";first=false;}
  s+=`<path d="${d}" fill="none" stroke="#5b3a96" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  g.pts.forEach(([x,y])=>{s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="6" fill="#ffd23f" stroke="#1d1630" stroke-width="2"/>`;});
  return s+"</svg>";
}

  showPanel(`<h2 id="ptitle">Einstellungen</h2>
   <label class="switch"><input type="checkbox" id="s-sound" ${S.sound?"checked":""}> Töne bei richtig und falsch</label>
   <label class="switch"><input type="checkbox" id="s-timer" ${S.timerOn?"checked":""}> Stoppuhr anzeigen (30 Minuten)</label>
   <div class="row"><button class="btn" data-close>Fertig</button><button class="btn alt" id="s-new">Neues Spiel mit neuen Aufgaben</button></div><div id="fb"></div>`);
  $("#s-sound").addEventListener("change",e=>S.sound=e.target.checked);
  $("#s-timer").addEventListener("change",e=>{S.timerOn=e.target.checked;renderTimer()});
  $("#s-new").addEventListener("click",()=>{$("#fb").innerHTML=`<div class="fb wrong">Wirklich neu starten? Alle Schlüssel gehen verloren.<div class="row" style="margin-top:8px"><button class="btn" id="s-yes">Ja, neu starten</button></div></div>`;$("#s-yes").addEventListener("click",restart);});
}
function restart(){const snd=S.sound,tm=S.timerOn;S=newState();S.sound=snd;S.timerOn=tm;S.started=true;startTimer();closePanel();}

S=newState();renderScene();intro();
})();
</script>
